services:
  mysql:
    image: mysql:8.4
    # 时区决策（数据库重构文档 §4）：存储层、服务端时钟、日志全部 UTC。
    command: >
      --default-time-zone=+00:00
      --log-timestamps=UTC
    environment:
      # Empty fallbacks keep `docker compose config` inspectable before .env is
      # prepared; MySQL startup still requires the real .env values.
      MYSQL_DATABASE: "${TRACE_DB_NAME:-}"
      MYSQL_USER: "${TRACE_DB_USER:-}"
      MYSQL_PASSWORD: "${TRACE_DB_PASSWORD:-}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-}"
    ports:
      - "${TRACE_DB_PUBLISHED_PORT:-3307}:3306"
    volumes:
      - trace_mysql_data:/var/lib/mysql
      # 资源参数（2C4G 同机部署）：缓冲池 256M、50 连接、关闭 performance_schema。
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/tutor-agent.cnf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  trace-db-init:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TRACE_DB_ENABLED: "true"
      TRACE_DB_HOST: mysql
      TRACE_DB_PORT: "3306"
      TRACE_DB_USER: "${TRACE_DB_USER:-}"
      TRACE_DB_PASSWORD: "${TRACE_DB_PASSWORD:-}"
      TRACE_DB_NAME: "${TRACE_DB_NAME:-}"
    depends_on:
      mysql:
        condition: service_healthy
    command: ["python", "scripts/init_trace_db.py"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      TEMP_DOCUMENT_ROOT: /data/runtime_data/attachments
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}"
      TRACE_DB_HOST: mysql
      TRACE_DB_PORT: "3306"
      TRACE_DB_ENABLED: "${TRACE_DB_ENABLED:-false}"
      TRACE_DB_USER: "${TRACE_DB_USER:-}"
      TRACE_DB_PASSWORD: "${TRACE_DB_PASSWORD:-}"
      TRACE_DB_NAME: "${TRACE_DB_NAME:-}"
    depends_on:
      mysql:
        # 迁移后 MySQL 成为业务库强依赖：必须等服务健康才能启动 API。
        condition: service_healthy
    expose:
      - "8001"
    volumes:
      - tutor_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

volumes:
  tutor_data:
  trace_mysql_data:
